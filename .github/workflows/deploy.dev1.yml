name: Deploy to dev1
on:
  workflow_dispatch:
    inputs:
      NODE_ENV:
        description: 'Node environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development

permissions:
  contents: read
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      github-environment: dev-gcp:dev1
      image-suffix: dev1-deploy
      env-file: |
        ENV=dev1
        NODE_ENV=${{ inputs.NODE_ENV }}
        ADMIN_ORIGIN=https://portal-admin-dev.oera.no
        APP_ORIGIN=https://www.ansatt.dev.nav.no
        REVALIDATOR_PROXY_ORIGIN=http://nav-enonicxp-frontend-revalidator-proxy-dev1
        DECORATOR_URL=https://dekoratoren.ekstern.dev.nav.no
        XP_ORIGIN=https://www.dev.nav.no
        TELEMETRY_URL=https://telemetry.ekstern.dev.nav.no/collect
        INNLOGGINGSSTATUS_URL=https://www.ekstern.dev.nav.no/person/nav-dekoratoren-api/auth
        NAVNO_SEARCH_API_URL=https://navno-search-api.ekstern.dev.nav.no/content/search-url
        MELDEKORT_API_URL=https://meldekort-api-q2.intern.dev.nav.no/meldekort/meldekort-api/api/person
        FAILOVER_ORIGIN=https://www-failover.intern.dev.nav.no
    secrets: inherit

  deploy:
    needs: build
    uses: navikt/navno-ci/.github/workflows/nais-deploy.yml@v1
    with:
      cluster: dev-gcp
      resource: .nais/config.yml
      hpa-resource: .nais/hpa/hpa-dev1.yml
      vars: .nais/vars/vars-dev1.yml
      var: image=${{ needs.build.outputs.image }}
