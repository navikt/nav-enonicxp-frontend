name: Deploy failover image to dev
on:
  workflow_dispatch:
    inputs:
      digest:
        description: 'GAR Digest'
        required: true
        type: string
      app_env:
        description: 'Dev environment'
        required: true
        default: 'dev1'
        type: choice
        options:
          - dev1
          - dev2
          - dev3

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: navikt/navno-ci/.github/workflows/nais-deploy.yml@v1
    with:
      cluster: dev-gcp
      resource: .nais/config-failover.yml
      vars: .nais/vars/vars-${{ inputs.app_env }}-failover.yml
      var: image=europe-north1-docker.pkg.dev/nais-management-233d/navno/nav-enonicxp-frontend@sha256:${{ inputs.digest }}
