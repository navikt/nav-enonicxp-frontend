name: Deploy to prod-failover
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    uses: navikt/navno-ci/.github/workflows/node-build.yml@v1
    with:
      github-environment: prod-gcp:failover
      image-suffix: failover-prod
      cdn-source: ./packages/nextjs/.next/static
      cdn-destination: nav-enonicxp-frontend/_next
      prune-remove: |
        node_modules
        packages/nextjs/node_modules
        packages/server/node_modules
        packages/shared/node_modules
      pnpm-deploy: |
        ./packages/server nonsymlink/server
        ./packages/nextjs nonsymlink/nextjs
      env-file-copy-to: |
        packages/nextjs/.env
        packages/server/.env
      build-cache-paths: packages/nextjs/.next/cache
      env-file: |
        ENV=prod
        NODE_ENV=production
        ADMIN_ORIGIN=https://portal-admin.oera.no
        APP_ORIGIN=https://www.nav.no
        REVALIDATOR_PROXY_ORIGIN=http://nav-enonicxp-frontend-revalidator-proxy
        DECORATOR_URL=https://www.nav.no/dekoratoren
        XP_ORIGIN=https://www.nav.no
        TELEMETRY_URL=https://telemetry.nav.no/collect
        INNLOGGINGSSTATUS_URL=https://www.nav.no/person/nav-dekoratoren-api/auth
        NAVNO_SEARCH_API_URL=https://navno-search-api.nav.no/content/search-url
        MELDEKORT_API_URL=https://meldekort-api.nav.no/meldekort/meldekort-api/api/person
        FAILOVER_ORIGIN=https://www-failover.nav.no
        IS_FAILOVER_INSTANCE=true
        ASSET_PREFIX=https://cdn.nav.no/navno/nav-enonicxp-frontend
        IMAGE_CACHE_DIR=/tmp/images
        NEXT_TELEMETRY_DISABLED=1
    secrets: inherit

  deploy:
    needs: build
    uses: navikt/navno-ci/.github/workflows/nais-deploy.yml@v1
    with:
      cluster: prod-gcp
      resource: .nais/config-failover.yml
      hpa-resource: .nais/hpa/hpa-prod-failover.yml
      vars: .nais/vars/vars-prod-failover.yml
      var: image=${{ needs.build.outputs.image }}
