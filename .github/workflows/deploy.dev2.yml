name: Deploy to dev2
on:
  workflow_dispatch:
    inputs:
      NODE_ENV:
        description: 'Node environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development

permissions:
  contents: read
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      github-environment: dev-gcp:dev2
      image-suffix: dev2-deploy
      env-file: |
        ENV=dev2
        NODE_ENV=${{ inputs.NODE_ENV }}
        ADMIN_ORIGIN=https://portal-admin-q6.oera.no
        APP_ORIGIN=https://www-2.ansatt.dev.nav.no
        REVALIDATOR_PROXY_ORIGIN=http://nav-enonicxp-frontend-revalidator-proxy-dev2
        DECORATOR_URL=https://dekoratoren-beta.intern.dev.nav.no
        XP_ORIGIN=https://www-q6.nav.no
        TELEMETRY_URL=https://telemetry.ekstern.dev.nav.no/collect
        INNLOGGINGSSTATUS_URL=https://www.ekstern.dev.nav.no/person/nav-dekoratoren-api/auth
        SEARCH_URL=https://www.ansatt.dev.nav.no/sok
        FAILOVER_ORIGIN=https://www-2-failover.intern.dev.nav.no
    secrets: inherit

  deploy:
    needs: build
    uses: navikt/navno-ci/.github/workflows/nais-deploy.yml@v1
    with:
      cluster: dev-gcp
      resource: .nais/config.yml
      hpa-resource: .nais/hpa/hpa-dev2.yml
      vars: .nais/vars/vars-dev2.yml
      var: image=${{ needs.build.outputs.image }}
